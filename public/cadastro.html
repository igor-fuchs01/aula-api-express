<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro | Aula API</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <header class="topo">
        <h1>Aula <span>API</span> · Monitoramento</h1>
        <nav><a href="./index.html">Entrar</a></nav>
    </header>

    <div class="card form-login">
        <h2>Criar conta</h2>
        <!-- POST /usuarios/cadastrar -->
        <label for="input_nome">Nome</label>
        <input id="input_nome">

        <label for="input_email">E-mail</label>
        <input id="input_email" type="email">

        <label for="input_senha">Senha</label>
        <input id="input_senha" type="password">

        <button onclick="cadastrar()">Cadastrar</button>
        <div id="div_mensagem" class="mensagem"></div>

        <h2 style="margin-top:24px">Requisições</h2>
        <div id="div_log" class="log-api"></div>
    </div>

    <script src="./js/sessao.js"></script>
    <script src="./js/cadastro.js"></script>
</body>
</html>
